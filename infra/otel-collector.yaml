# OpenTelemetry Collector: recebe spans OTLP dos serviços (gRPC :4317, HTTP :4318) e os repassa
# ao Jaeger. Os serviços falam OTLP/HTTP; trocar o backend de traces só mexe neste arquivo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Jaeger recebe OTLP gRPC nativamente; sem TLS dentro da rede do compose.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
