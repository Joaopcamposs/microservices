[project]
name = "worker-taskiq"
version = "0.1.0"
description = "Worker TaskIQ: bridge aio-pika (jobs.taskiq) + task TaskIQ que grava job_results"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.4",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "prometheus-client>=0.20",
    "taskiq>=0.13.0",
    "taskiq-aio-pika>=0.6.1",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# D1xx: exige docstring em módulo, classe e função (regra do AGENTS.md).
select = ["E", "F", "I", "UP", "B", "ASYNC", "D1"]
