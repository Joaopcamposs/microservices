# Infra e serviços do laboratório. Perfis: `python`, `go`, `observability` e `all` (ver README, seção 10).
# `make up` sobe só rabbitmq e postgres; os serviços de aplicação entram com `--profile`.
# Todos têm o mesmo limite (1 CPU, 512 MB) para o benchmark ser justo. `OTEL_ENDPOINT=` (vazio)
# desliga a exportação de traces: o benchmark roda assim para não medir a observabilidade.
services:
  # Broker de mensagens. A topologia (exchanges, filas, DLQ) vem de definitions.json no boot.
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Banco compartilhado: jobs, job_results e outbox. As migrations rodam na primeira subida.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ["5432:5432"]
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "lab"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API FastAPI. Contexto de build na raiz para a imagem receber `contracts/`.
  gateway-py:
    build:
      context: .
      dockerfile: services/gateway-py/Dockerfile
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://postgres:lab@postgres:5432/lab
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    profiles: [python, all]

  # Único publicador do RabbitMQ: lê a outbox e publica com confirm. Métricas em :9100/metrics.
  outbox-relay:
    build: ./services/outbox-relay
    environment:
      RELAY_DATABASE_URL: postgres://postgres:lab@postgres:5432/lab
      RELAY_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["9100:9100"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [python, go, all]

  # Worker asyncio puro: consome jobs.asyncio e grava job_results. Métricas em :9101/metrics.
  worker-asyncio:
    build:
      context: .
      dockerfile: services/worker-asyncio/Dockerfile
    environment:
      WORKER_DATABASE_URL: postgresql://postgres:lab@postgres:5432/lab
      WORKER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["9101:9101"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [python, all]

  # Bridge do Celery: lê o envelope de jobs.celery e entrega a task ao Celery. Métricas em :9103.
  # Mesma imagem do worker-celery; só o comando muda.
  celery-bridge:
    build:
      context: .
      dockerfile: services/worker-celery/Dockerfile
    command: ["python", "-m", "app.bridge_main"]
    environment:
      WORKER_DATABASE_URL: postgresql://postgres:lab@postgres:5432/lab
      WORKER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["9103:9103"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [python, all]

  # Worker Celery (prefork, 4 processos): executa a task e grava job_results.
  worker-celery:
    build:
      context: .
      dockerfile: services/worker-celery/Dockerfile
    environment:
      WORKER_DATABASE_URL: postgresql://postgres:lab@postgres:5432/lab
      WORKER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [python, all]

  # Bridge do TaskIQ: lê o envelope de jobs.taskiq e entrega a task ao TaskIQ. Métricas em :9104.
  # Mesma imagem do worker-taskiq; só o comando muda.
  taskiq-bridge:
    build:
      context: .
      dockerfile: services/worker-taskiq/Dockerfile
    command: ["python", "-m", "app.bridge_main"]
    environment:
      WORKER_DATABASE_URL: postgresql://postgres:lab@postgres:5432/lab
      WORKER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["9104:9104"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [python, all]

  # Worker TaskIQ (2 processos, 32 tasks async cada): executa a task e grava job_results.
  worker-taskiq:
    build:
      context: .
      dockerfile: services/worker-taskiq/Dockerfile
    environment:
      WORKER_DATABASE_URL: postgresql://postgres:lab@postgres:5432/lab
      WORKER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [python, all]

  # API Gin com a mesma interface do gateway-py. Swagger em http://localhost:8001/swagger.
  gateway-go:
    build:
      context: .
      dockerfile: services/gateway-go/Dockerfile
    environment:
      GATEWAY_DATABASE_URL: postgres://postgres:lab@postgres:5432/lab
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [go, all]

  # Worker Go (goroutines): consome jobs.go e grava job_results. Métricas em :9102/metrics.
  worker-go:
    build:
      context: .
      dockerfile: services/worker-go/Dockerfile
    environment:
      WORKER_DATABASE_URL: postgres://postgres:lab@postgres:5432/lab
      WORKER_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT-http://otel-collector:4318}
    ports: ["9102:9102"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    restart: unless-stopped
    profiles: [go, all]

  # Servidor de mock para o job io.fetch_urls: /delay/{ms} e /status/{code}. Porta 8090.
  # Latência controlada e sem internet; alcançável pelos workers como http://mock-server:8090.
  mock-server:
    build: ./services/mock-server
    ports: ["8090:8090"]
    restart: unless-stopped
    profiles: [python, go, all]

  # ---- Observabilidade (perfil `observability`; `all` inclui) --------------------------------

  # Recebe OTLP dos serviços e repassa ao Jaeger (infra/otel-collector.yaml).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4318:4318"]
    depends_on: [jaeger]
    restart: unless-stopped
    profiles: [observability, all]

  # Backend e UI de traces: http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports: ["16686:16686"]
    restart: unless-stopped
    profiles: [observability, all]

  # Scrape de métricas (infra/prometheus.yml): http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped
    profiles: [observability, all]

  # CPU e memória por container, para o Prometheus. No Docker Desktop (macOS) o cAdvisor não
  # enxerga os cgroups dos containers (sem label `name`); no Linux, onde o benchmark roda, sim.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    profiles: [observability, all]

  # Dashboards provisionados (infra/grafana): http://localhost:3000, sem login.
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]
    restart: unless-stopped
    profiles: [observability, all]
